<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile Test</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
    }
    main {
      width: min(88vw, 520px);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 24px;
      padding: 28px;
      background: rgba(255,255,255,.04);
    }
    h1 { font-size: 28px; margin: 0 0 12px; }
    p { color: rgba(255,255,255,.68); line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>Mobile test loaded.</h1>
    <p>如果你能在手机微信或手机浏览器打开这个页面，说明 Vercel 域名可以访问，问题在首页资源/JS/视频。</p>
    <p>如果这个页面也打不开，说明问题不是首页代码，而是域名、DNS、网络或微信 WebView 访问问题。</p>
  </main>
</body>
</html>
